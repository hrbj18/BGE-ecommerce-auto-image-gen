name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm through Corepack
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm run typecheck
      - name: Test
        run: pnpm test
      - name: Build frontend
        run: pnpm run frontend:build
      - name: Audit handoff and release package
        run: |
          pnpm run handoff:audit
          pnpm run release:audit
